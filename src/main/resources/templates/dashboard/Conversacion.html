<!DOCTYPE html>
<html lang="es" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title th:text="${chat.nombre} + ' - Chat'">Chat</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0-beta3/css/all.min.css" rel="stylesheet">
    <style>
        .sidebar {
            position: fixed;
            width: 250px;
            height: 100vh;
            background: black;
            color: white;
        }

        .sidebarElement {
            display: block;
            color: white;
            padding: 10px;
            text-decoration: none;
        }

        .sidebarElement.active {
            background: white;
            color: black;
        }

        .sidebarElement:hover {
            background: #535353;
            color: #ffffff;
        }

        .dashTitle {
            display: block;
            color: white;
            text-decoration: none;
            background: #000000;
            padding: 20px;
            font-family: "Playfair Display", Georgia, "Times New Roman", serif;
            font-size: 2.25rem;
        }

        .chat-container {
            margin-left: 300px; /* Same as sidebar width */
            margin-top: 20px; /* Margin from the top */
            margin-bottom: 20px; /* Margin from the bottom */
            width: calc(95vw - 300px); /* Take the full width minus the sidebar */
            max-height: calc(100vh - 120px); /* Maximum height to fit within the viewport */
            padding: 20px;
            background: #f9f9f9;
            border-radius: 10px;
            box-shadow: 0 0 10px rgba(0, 0, 0, 0.1);
            overflow-y: auto; /* Enable vertical scroll */
        }


        .message-bubble {
            padding: 10px 15px;
            border-radius: 10px;
            margin-bottom: 10px;
            max-width: 70%;
        }

        .message-bubble.user {
            background: black; /* Fondo negro */
            color: white; /* Texto blanco */
            margin-left: auto; /* Alinea a la derecha */
            text-align: right;
        }

        .message-bubble.admin {
            background: #f1f1f1; /* Fondo gris claro */
            color: black; /* Texto negro */
            margin-right: auto; /* Alinea a la izquierda */
            text-align: left;
        }


        .chat-input {
            display: flex;
            margin-top: 20px;
        }

        .chat-input input {
            flex: 1;
            padding: 10px;
            border: 1px solid #ddd;
            border-radius: 5px;
            margin-right: 10px;
        }

        .chat-input button {
            padding: 10px 20px;
            background: #007bff;
            color: white;
            border: none;
            border-radius: 5px;
            cursor: pointer;
        }
    </style>
</head>
<body>
<div class="d-flex">
    <!-- Sidebar -->
    <div class="sidebar">

        <h2><a href="/" class="dashTitle">Mi Blog</a></h2>
        <a href="/crud-chats" class="active sidebarElement">Chats</a>
        <a href="/crud-articulo" class=" sidebarElement">Artículos</a>
        <a href="/crud-simple" class=" sidebarElement">Usuarios</a>
    </div>
</div>
<div class="chat-container">
    <h1 th:text="${chat.nombre} + ' - Chat'">Chat</h1>
    <div id="chat-messages">
        <!-- Renderizar los mensajes
        <div th:each="mensaje : ${mensajes}"
             class="message-bubble"
             th:classappend="${mensaje.enviado} ? 'admin' : 'user'">
            <p th:text="${mensaje.mensaje}"></p>
        </div>-->
    </div>

    <form id="chat-form" th:action="@{/send}" method="post" class="chat-input">
        <input type="text" name="mensaje" placeholder="Escribe tu mensaje..." required>
        <button type="submit">Enviar</button>
    </form>
</div>
<script src="/js/adminchatjs.js"></script>
</body>
</html>
